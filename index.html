            const selected = getRandomItems(data, count);
            container.innerHTML = selected.map((item, index) => `
                <div class="card" onclick="showDetail(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                    <div class="card-icon">${item.icon}</div>
                    <h3>${item.title}</h3>
                    <p>${item.content}</p>
                    <span class="card-tag">${item.tag}</span>
                </div>
            `).join('');
        }
        
        // 显示详情模态框
        function showDetail(item) {
            document.getElementById('modal-icon').textContent = item.icon;
            document.getElementById('modal-title').textContent = item.title;
            document.getElementById('modal-tag').textContent = item.tag;
            document.getElementById('modal-content').textContent = item.detail || item.content;
            
            // 填充实战案例
            const casesList = document.getElementById('modal-cases');
            if (item.cases && item.cases.length > 0) {
                casesList.innerHTML = item.cases.map(caseText => 
                    `<li><strong>案例：</strong>${caseText}</li>`
                ).join('');
            } else {
                casesList.innerHTML = '<li>暂无案例数据</li>';
            }
            
            // 填充相关知识点
            const relatedTags = document.getElementById('modal-related');
            if (item.related && item.related.length > 0) {
                relatedTags.innerHTML = item.related.map(tag => 
                    `<span class="related-tag">${tag}</span>`
                ).join('');
            } else {
                relatedTags.innerHTML = '<span class="related-tag">暂无相关标签</span>';
            }
            
            // 显示模态框
            document.getElementById('detail-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            
            // 更新 URL hash
            window.location.hash = `detail-${item.title.replace(/\s+/g, '-')}`;
        }
        
        // 关闭模态框
        function closeModal() {
            document.getElementById('detail-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
            window.location.hash = '';
        }
        
        // 显示随机卡片
        function showRandomCard() {
            const allCards = [...businessFacts, ...wisdomCards];
            const random = allCards[Math.floor(Math.random() * allCards.length)];
            const card = document.getElementById('random-card');
            card.style.display = 'block';
            card.innerHTML = `<div class="card" onclick="showDetail(${JSON.stringify(random).replace(/"/g, '&quot;')})" style="max-width: 400px; margin: 0 auto; text-align: left;">
                <div class="card-icon">${random.icon}</div>
                <h3>${random.title}</h3>
                <p>${random.content}</p>
                <span class="card-tag">${random.tag}</span>
            </div>`;
        }
        
        // 页面加载时渲染内容
        document.addEventListener('DOMContentLoaded', function() {
            renderCards(businessFacts, 'facts-grid', 3);
            renderCards(wisdomCards, 'wisdom-grid', 3);
            
            // 点击模态框外部关闭
            document.getElementById('detail-modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
            
            // ESC 键关闭模态框
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
