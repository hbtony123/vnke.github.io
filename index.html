<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNKE - 一分钟商业智慧</title>
    <meta name="description" content="VNKE - 一分钟商业智慧。用娱乐化的方式传递商业洞察、职场智慧和创业故事。每天一分钟，让你的认知升级。">
    <meta name="keywords" content="商业知识，职场智慧，创业故事，商业冷知识，一分钟课堂，知识娱乐，VNKE">
    <meta name="author" content="VNKE">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
    <style>
        :root { --primary: #2563eb; --primary-dark: #1d4ed8; --secondary: #10b981; --accent: #f59e0b; --dark: #1e293b; --light: #f8fafc; --gray: #64748b; --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; line-height: 1.6; color: var(--dark); background: var(--light); overflow-x: hidden; }
        .hero { min-height: 100vh; background: var(--gradient); display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="white" opacity="0.1"/></svg>'); background-size: 50px 50px; animation: float 20s infinite linear; }
        @keyframes float { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-100px) rotate(360deg); } }
        .hero-content { position: relative; z-index: 2; max-width: 800px; }
        .hero h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 800; color: white; margin-bottom: 1rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); animation: fadeInUp 0.8s ease; }
        .hero p { font-size: clamp(1.1rem, 3vw, 1.5rem); color: rgba(255,255,255,0.9); margin-bottom: 2rem; animation: fadeInUp 0.8s ease 0.2s both; }
        .hero .tagline { font-size: clamp(0.9rem, 2.5vw, 1.2rem); color: rgba(255,255,255,0.8); font-style: italic; margin-bottom: 3rem; animation: fadeInUp 0.8s ease 0.4s both; }
        .cta-button { display: inline-block; padding: 1rem 2.5rem; background: white; color: var(--primary); font-size: 1.1rem; font-weight: 600; text-decoration: none; border-radius: 50px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2); animation: fadeInUp 0.8s ease 0.6s both; }
        .cta-button:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .daily-quote { background: white; padding: 2rem 1.5rem; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .quote-text { font-size: 1.2rem; font-style: italic; color: var(--dark); margin-bottom: 0.5rem; max-width: 800px; margin-left: auto; margin-right: auto; }
        .quote-author { color: var(--gray); font-size: 0.9rem; }
        .content-section { padding: 2rem 1.5rem; max-width: 900px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 1.8rem; margin-bottom: 0.8rem; color: var(--dark); }
        .section-subtitle { text-align: center; color: var(--gray); margin-bottom: 1.5rem; font-size: 0.9rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .card { background: white; border-radius: 10px; padding: 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.2s ease; cursor: pointer; position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: var(--gradient); }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card-icon { font-size: 2rem; margin-bottom: 0.6rem; }
        .card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--dark); }
        .card p { color: var(--gray); font-size: 0.85rem; line-height: 1.5; margin-bottom: 0.6rem; }
        .card-tag { display: inline-block; padding: 0.2rem 0.6rem; background: rgba(37, 99, 235, 0.1); color: var(--primary); border-radius: 12px; font-size: 0.7rem; font-weight: 500; }
        .random-section { text-align: center; padding: 2rem 1.5rem; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); }
        .random-btn { background: var(--gradient); color: white; border: none; padding: 0.8rem 2rem; font-size: 1rem; font-weight: 600; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
        .random-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6); }
        #random-card { margin-top: 1.5rem; display: none; }
        footer { background: var(--dark); color: white; text-align: center; padding: 2rem 1.5rem; margin-top: 3rem; }
        .footer-content { max-width: 600px; margin: 0 auto; }
        .footer-logo { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.8rem; }
        .footer-text { color: rgba(255,255,255,0.7); margin-bottom: 1.5rem; }
        .social-links { display: flex; justify-content: center; gap: 1.2rem; margin-bottom: 1.5rem; }
        .social-link { color: white; font-size: 1.3rem; transition: all 0.3s ease; text-decoration: none; }
        .social-link:hover { transform: scale(1.2); color: var(--accent); }
        @media (max-width: 768px) { .hero h1 { font-size: 2.2rem; } .section-title { font-size: 1.6rem; } .grid { grid-template-columns: 1fr; } .quote-text { font-size: 1.1rem; } }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <h1>💡 VNKE</h1>
            <p>一分钟商业智慧</p>
            <p class="tagline">用娱乐化的方式，让知识变得有趣</p>
            <a href="#content" class="cta-button">开始探索</a>
        </div>
    </section>
    <section class="daily-quote">
        <div class="quote-text" id="daily-quote">"在信息过载的时代，清晰就是力量。"</div>
        <div class="quote-author">— 每日商业金句</div>
    </section>
    <section class="content-section" id="content">
        <h2 class="section-title">🔥 热门商业冷知识</h2>
        <p class="section-subtitle">这些你可能不知道的商界趣闻，让你成为聚会中的话题王者</p>
        <div class="grid" id="facts-grid"></div>
    </section>
    <section class="content-section" style="background: #f8fafc;">
        <h2 class="section-title">💡 一分钟职场智慧</h2>
        <p class="section-subtitle">每天一分钟，让你的职场认知升级</p>
        <div class="grid" id="wisdom-grid"></div>
    </section>
    <section class="random-section">
        <h2 class="section-title">🎲 随机知识卡片</h2>
        <p class="section-subtitle">不知道看什么？点击获取随机惊喜！</p>
        <button class="random-btn" onclick="showRandomCard()">🎯 给我来个惊喜</button>
        <div id="random-card"></div>
    </section>
    <footer>
        <div class="footer-content">
            <div class="footer-logo">VNKE.com</div>
            <p class="footer-text">让知识变得有趣，让商业变得简单</p>
            <div class="social-links">
                <a href="#" class="social-link" title="微信">💬</a>
                <a href="#" class="social-link" title="微博">🌐</a>
                <a href="#" class="social-link" title="LinkedIn">💼</a>
            </div>
            <p style="color: rgba(255,255,255,0.5); font-size: 0.9rem;">© 2026 VNKE. 保留所有权利。</p>
        </div>
    </footer>
    <script>
        // 商业冷知识池（20条）
        const businessFacts = [
            { icon: "📱", title: "iPhone 的秘密", content: "乔布斯把 iPhone 定价 499 美元而非 500 美元，利用'左位效应'让价格看起来更便宜。", tag: "定价策略" },
            { icon: "☕", title: "星巴克的魔法", content: "星巴克全球 3 万家门店，年收入超 300 亿，靠的是'第三空间'概念而非咖啡本身。", tag: "品牌定位" },
            { icon: "👟", title: "耐克的钩子", content: "耐克的 Swoosh 标志当年只花了 35 美元，如今品牌价值超 240 亿美元。", tag: "品牌价值" },
            { icon: "🍔", title: "麦当劳的地产商", content: "麦当劳本质是房地产公司，利润主要来自门店租金而非汉堡。", tag: "商业模式" },
            { icon: "🎮", title: "任天堂的转型", content: "任天堂 1889 年做扑克牌起家，1970 年代转型游戏，如今市值超 600 亿。", tag: "企业转型" },
            { icon: "🚗", title: "特斯拉的预售", content: "Model 3 发布 24 小时获 32.5 万预订，预收款超 20 亿美元，史上最大预售之一。", tag: "营销策略" },
            { icon: "📺", title: "Netflix 的赌注", content: "Netflix 无试播集直接投 1 亿订 2 季《纸牌屋》，开启流媒体原创时代。", tag: "内容战略" },
            { icon: "🔍", title: "谷歌的免费策略", content: "谷歌搜索免费，靠广告年赚 1500 亿，'免费+广告'模式改变互联网。", tag: "盈利模式" },
            { icon: "🛒", title: "亚马逊的飞轮", content: "低价→多客户→多卖家→低成本→更低价的飞轮效应，造就万亿巨头。", tag: "增长策略" },
            { icon: "📱", title: "微信的超级应用", content: "微信 12 亿用户，集社交、支付、购物、打车于一体，一个 App 搞定生活。", tag: "生态战略" },
            { icon: "💰", title: "巴菲特的复利", content: "巴菲特 99% 的财富在 50 岁后获得，复利+长期主义是财富密码。", tag: "投资智慧" },
            { icon: "📦", title: "宜家的平板包装", content: "宜家平板包装降低 70% 运输成本，让用户自己组装，价格低一半。", tag: "成本控制" },
            { icon: "🎬", title: "迪士尼的 IP 帝国", content: "迪士尼靠 IP 授权和衍生品赚钱，电影只是入口，授权收入超票房。", tag: "IP 运营" },
            { icon: "🚀", title: "SpaceX 的回收", content: "SpaceX 火箭回收技术将发射成本降低 90%，彻底改变航天业。", tag: "技术创新" },
            { icon: "📱", title: "拼多多的下沉", content: "拼多多瞄准下沉市场，用社交裂变 3 年上市，市值超京东。", tag: "市场定位" },
            { icon: "🎧", title: "Spotify 的订阅", content: "Spotify 用订阅制颠覆音乐产业，用户付费意愿远超想象。", tag: "订阅经济" },
            { icon: "🏨", title: "Airbnb 的轻资产", content: "Airbnb 无一间房，靠平台模式成为全球最大酒店集团。", tag: "平台经济" },
            { icon: "📱", title: "TikTok 的算法", content: "TikTok 推荐算法让用户'停不下来'，18 个月用户破 10 亿。", tag: "算法驱动" },
            { icon: "🛍️", title: "Costco 的会员", content: "Costco 商品毛利仅 14%，靠会员费赚钱，续费率超 90%。", tag: "会员经济" },
            { icon: "🎮", title: "索尼的生态", content: "索尼 PlayStation 硬件不赚钱，靠游戏销售和订阅盈利。", tag: "生态闭环" }
        ];
        
        // 职场智慧池（15条）
        const wisdomCards = [
            { icon: "💼", title: "谈判技巧", content: "谈判时让对方先报价，谁先亮底牌谁被动。掌握主动权的关键是'后发制人'。", tag: "沟通" },
            { icon: "⏰", title: "时间管理", content: "'两分钟法则'：2 分钟内能做的事，立刻做，别拖延。", tag: "效率" },
            { icon: "🎯", title: "目标设定", content: "SMART 原则：具体、可衡量、可实现、相关性强、有时限。模糊目标=模糊结果。", tag: "规划" },
            { icon: "🤝", title: "人脉建设", content: "人脉不是认识多少人，而是多少人认可你的价值。先给价值，再求回报。", tag: "社交" },
            { icon: "📊", title: "数据思维", content: "决策用数据说话，别凭感觉。数据不会撒谎，但会告诉你真相。", tag: "分析" },
            { icon: "🔄", title: "持续学习", content: "每天 30 分钟学习新技能，一年下来比 90% 的人领先。学习是最好的人力资本投资。", tag: "成长" },
            { icon: "💡", title: "创新思维", content: "创新不是发明新东西，而是用旧元素组合出新价值。跨界思维是关键。", tag: "创新" },
            { icon: "🎭", title: "情绪管理", content: "情绪是信号不是敌人。识别情绪背后的需求，才能有效管理。", tag: "情商" },
            { icon: "📝", title: "向上管理", content: "向上管理不是讨好，而是让上级知道你的价值和困难，争取资源。", tag: "职场" },
            { icon: "🎪", title: "精力管理", content: "管理精力而非时间。找到你的黄金时段，做最重要的事。", tag: "效率" },
            { icon: "🔑", title: "关键决策", content: "重大决策用'10-10-10 法则'：10 分钟、10 个月、10 年后怎么看这个决定？", tag: "决策" },
            { icon: "🎯", title: "专注力", content: "一次只做一件事。多任务处理是效率杀手，专注才是王道。", tag: "效率" },
            { icon: "🤔", title: "批判性思维", content: "别轻易接受信息，问'证据是什么？''逻辑成立吗？'培养独立思考。", tag: "思维" },
            { icon: "🌟", title: "个人品牌", content: "你的个人品牌是你离开岗位后别人怎么评价你。让口碑成为你的资产。", tag: "品牌" },
            { icon: "🚀", title: "快速试错", content: "小步快跑，快速试错。完美是完成的天敌，先做出来再优化。", tag: "执行" }
        ];
        
        // 随机抽取指定数量的不重复项
        function getRandomItems(arr, count) {
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }
        
        // 渲染卡片到指定容器
        function renderCards(data, containerId, count) {
            const container = document.getElementById(containerId);
            const selected = getRandomItems(data, count);
            container.innerHTML = selected.map(item => `
                <div class="card">
                    <div class="card-icon">${item.icon}</div>
                    <h3>${item.title}</h3>
                    <p>${item.content}</p>
                    <span class="card-tag">${item.tag}</span>
                </div>
            `).join('');
        }
        
        // 显示随机卡片
        function showRandomCard() {
            const allCards = [...businessFacts, ...wisdomCards];
            const random = allCards[Math.floor(Math.random() * allCards.length)];
            const card = document.getElementById('random-card');
            card.style.display = 'block';
            card.innerHTML = `<div class="card" style="max-width: 400px; margin: 0 auto; text-align: left;">
                <div class="card-icon">${random.icon}</div>
                <h3>${random.title}</h3>
                <p>${random.content}</p>
                <span class="card-tag">${random.tag}</span>
            </div>`;
        }
        
        // 页面加载时渲染内容
        document.addEventListener('DOMContentLoaded', function() {
            renderCards(businessFacts, 'facts-grid', 3);
            renderCards(wisdomCards, 'wisdom-grid', 3);
        });
    </script>
</body>
</html>
